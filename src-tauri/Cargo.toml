[package]
name = "matex"
version = "0.1.0"
description = "MaTex word processor"
edition = "2021"

[lib]
name = "matex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
