[package]
name = "matex"
version = "0.2.0"
description = "MaTex word processor"
edition = "2021"

[lib]
name = "matex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

# Minors pinned to match the npm @tauri-apps packages; the CLI refuses mismatched versions.
[dependencies]
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
tauri-plugin-fs = "~2.7"
